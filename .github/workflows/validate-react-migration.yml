name: Validate PlanPlannerU React migration

on:
  push:
    branches:
      - feature/react-vite-migration-clean
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install
      - name: Generate temporary npm lockfile for review
        if: github.event_name == 'push'
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Upload generated lockfile
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: planplanneru-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1
      - run: npm run build
      - run: npm test
