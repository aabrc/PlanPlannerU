name: Generate npm lockfile once

on:
  push:
    branches:
      - feature/react-vite-migration-clean
    paths:
      - .github/workflows/generate-lockfile-once.yml

permissions:
  contents: write

jobs:
  generate-lockfile:
    if: github.event.head_commit.message == 'Generate npm lockfile once'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Resolve exact dependency versions
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile to the development branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json is already up to date."
            exit 0
          fi
          git commit -m "chore: add generated npm lockfile [skip ci]"
          git push origin HEAD:${GITHUB_REF_NAME}
